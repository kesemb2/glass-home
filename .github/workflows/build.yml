name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Branch builds replace each other; every push to main is built and released in order.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # versionCode. Never rename this workflow file: GitHub restarts run numbers per workflow,
      # and a lower versionCode would refuse to install over the current build.
      BUILD_NUMBER: ${{ github.run_number }}
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Secrets SIGNING_KEYSTORE_BASE64 / SIGNING_KEYSTORE_PASSWORD are missing. Releases must be signed with the fixed key."
            exit 1
          else
            echo "::warning::No signing secrets available: this build produces an unsigned APK that cannot be installed."
          fi

      - name: Unit tests
        shell: bash
        run: ./gradlew test 2>&1 | tee -a build.log

      - name: Build release APK
        shell: bash
        run: ./gradlew assembleRelease 2>&1 | tee -a build.log

      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |What went wrong|FAILED|Test.*>.*FAILED|AssertionError|expected:<' -A 3 build.log | head -n 80 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check budgets (size, native libraries)
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" glass-home.apk
          size=$(stat -c %s glass-home.apk)
          echo "APK size: $size bytes"
          echo "APK size: **$((size / 1024)) KB** (budget 6144 KB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((6 * 1024 * 1024)) ]; then
            echo "::error::APK is $size bytes, over the 6 MB budget."
            exit 1
          fi
          native_libs=$(unzip -Z1 glass-home.apk | grep -E '\.so$' || true)
          if [ -n "$native_libs" ]; then
            echo "::error::APK contains native libraries: $(echo $native_libs)"
            exit 1
          fi

      - name: Verify signature
        if: env.SIGNING_KEYSTORE_PATH != ''
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs glass-home.apk | tee signing.txt
          grep -m 1 'certificate SHA-256 digest' signing.txt | sed 's/.*: //' > cert-sha256.txt
          "$build_tools/aapt2" dump badging glass-home.apk | grep -o "versionName='[^']*'" | cut -d "'" -f 2 > version.txt
          echo "Version $(cat version.txt), signing certificate SHA-256 $(cat cert-sha256.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: glass-home-${{ github.run_number }}
          path: glass-home.apk
          retention-days: 14

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat version.txt)
          {
            echo "$(git log -1 --format=%s)"
            echo
            echo "- Version: \`$version\` (versionCode $BUILD_NUMBER)"
            echo "- Commit: $GITHUB_SHA"
            echo "- Signing certificate SHA-256: \`$(cat cert-sha256.txt)\`"
            echo
            echo "Install: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/glass-home.apk"
          } > notes.md
          gh release create "build-$BUILD_NUMBER" glass-home.apk \
            --target "$GITHUB_SHA" \
            --title "Glass Home $version" \
            --notes-file notes.md \
            --latest

      - name: Prune old releases (keep 10)
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' \
            | xargs -r -n 1 gh release delete --cleanup-tag --yes
